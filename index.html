function haversineMiles(lat1,lng1,lat2,lng2){
  const R=3958.8, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function nearestAnchor(metroId){
  const c = METRO_COORDS[metroId];
  if (!c) return null;
  let best=null;
  for (const a of SILA_ANCHORS){
    const d = haversineMiles(c[0],c[1],a.lat,a.lng);
    if (!best || d < best.miles) best = { name:a.name, miles:Math.round(d) };
  }
  return best;
}

function MatchTab() {
  const [commercial, setCommercial] = useState(30);
  const [trades, setTrades] = useState(2);
  const [multiLoc, setMultiLoc] = useState(false);

  const ranked = useMemo(() => {
    return METROS.map(m => {
      let fit = 100 - Math.abs(commercial - m.commercialTilt);
      fit -= Math.abs(trades - m.tradeDiversification) * 8;
      if (multiLoc) {
        fit += (m.consolidation === "High" ? 10 : m.consolidation === "Medium" ? 4 : -6);
      } else {
        fit += (m.consolidation === "Low" ? 6 : 0);
      }
      const blended = Math.round(fit * 0.5 + m.score * 0.5);
      return { ...m, fit: Math.max(0, Math.min(100, blended)) };
    }).sort((a,b) => b.fit - a.fit);
  }, [commercial, trades, multiLoc]);

  return (
    <div>
      <div className="card">
        <div className="slider-block">
          <div className="slider-label"><span>Residential ↔ Commercial mix</span><span>{commercial}% commercial</span></div>
          <input type="range" min="0" max="100" value={commercial} onChange={e=>setCommercial(Number(e.target.value))} />
          <div className="slider-ends"><span>All Residential</span><span>All Commercial</span></div>
        </div>
        <div className="slider-block">
          <div className="slider-label"><span>Trade diversification</span><span>{trades === 1 ? "Single trade" : trades === 2 ? "Two trades" : "Three+ trades"}</span></div>
          <input type="range" min="1" max="3" value={trades} onChange={e=>setTrades(Number(e.target.value))} />
          <div className="slider-ends"><span>Single trade</span><span>Full multi-trade</span></div>
        </div>
        <div className="toggle-row" style={{marginBottom:0}}>
          <button className={"pill-btn" + (!multiLoc ? " active":"")} onClick={()=>setMultiLoc(false)}>Single location</button>
          <button className={"pill-btn" + (multiLoc ? " active":"")} onClick={()=>setMultiLoc(true)}>Multi-location roll-up</button>
        </div>
      </div>

      <div style={{display:"flex", gap:12, flexWrap:"wrap", alignItems:"center", marginBottom:14}}>
        <div className="sub" style={{marginBottom:0, flex:1}}>Metros ranked by fit to this profile — fit blends slider alignment with the underlying market target score.</div>
        <button className="print-btn" onClick={() => {
          const profile = `${commercial}% commercial mix · ${trades === 1 ? "Single trade" : trades === 2 ? "Two trades" : "Three+ trades"} · ${multiLoc ? "Multi-location roll-up" : "Single location"}`;
          const body = `
            <h2>Target Profile</h2><p>${profile}</p>
            <h2>Ranked Shortlist</h2>
            <table><tr><th>#</th><th>Metro</th><th>Fit Score</th><th>Market Score</th><th>Acquisition Archetype (illustrative)</th></tr>
            ${ranked.map((m,i) => `<tr><td>${i+1}</td><td class="badge">${m.name}, ${m.state}</td><td class="badge">${m.fit}</td><td>${m.score}</td><td>${m.archetype}</td></tr>`).join("")}
            </table>`;
          openPrint("Target Matching Shortlist", body);
        }}>🖨 Print Shortlist</button>
      </div>
      {ranked.map((m,i) => (
        <div key={m.id} className="metro-card" style={{display:"flex", gap:16, alignItems:"flex-start"}}>
          <div className="rank-num">{i+1}</div>
          <div style={{flex:1}}>
            <div className="metro-head">
              <div>
                <div className="metro-name" style={{fontSize:18}}>{m.name}, {m.state}</div>
                <div className="metro-state">{m.population}</div>
                <div style={{marginTop:6, display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
                  <span className={"terr-chip terr-" + stateExpansionClass(m.state)}>
                    {stateExpansionClass(m.state) === "operating" ? "IN CURRENT FOOTPRINT" : stateExpansionClass(m.state) === "adjacent" ? "CONTIGUOUS EXPANSION" : "NEW TERRITORY"}
                  </span>
                  {nearestAnchor(m.id) && <span style={{fontSize:12, color:"#8FA6BC"}}>~{nearestAnchor(m.id).miles} mi from nearest Sila market</span>}
                </div>
              </div>
              <div className="score-chip"><div className="n">{m.fit}</div><div className="l">Fit Score</div></div>
            </div>
            <div className="archetype-box">{m.archetype}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function CompareTab() {
  const [picked, setPicked] = useState(["OH","VA","NC"]);
  const [query, setQuery] = useState("");
  const [layers, setLayers] = useState({
    rating:true, moat:true, licensing:true, incentive:true,
    footprint:true, distributors:true, schools:true, metros:true
  });
  const LAYER_LABELS = {
    rating:"M&A Rating", moat:"Licensing Moat", licensing:"Licensing Model", incentive:"Incentive Exposure",
    footprint:"Footprint & Contiguity", distributors:"Distributor Coverage", schools:"Trade-School Pipeline", metros:"Sample Metros"
  };
  const byAbbr = Object.fromEntries(STATE_ROWS.map(s => [s.abbr, s]));
  const suggestions = query.trim() === "" ? [] : STATE_ROWS.filter(s =>
    !picked.includes(s.abbr) &&
    (s.name.toLowerCase().includes(query.toLowerCase()) || s.abbr.toLowerCase() === query.trim().toLowerCase())
  ).slice(0,5);
  const addState = (abbr) => { if (picked.length < 4 && !picked.includes(abbr)) setPicked([...picked, abbr]); setQuery(""); };
  const states = picked.map(a => byAbbr[a]).filter(Boolean);

  const cellFor = (layer, s) => {
    const cls = stateExpansionClass(s.abbr);
    switch(layer){
      case "rating": return <span className={"rating-badge rating-"+s.rating}>{s.rating}</span>;
      case "moat": return <div><MoatBars moat={s.moat} /><div className="note-line" style={{marginTop:4}}>{MOAT_LABELS[s.moat]}</div></div>;
      case "licensing": return s.licensing;
      case "incentive": return s.incentive + (s.incentive === "High" ? " — underwrite incentive-dependent revenue explicitly" : "");
      case "footprint": {
        const opN = (NEIGHBORS[s.abbr]||[]).filter(n => OPERATING_STATES.includes(n));
        return cls === "operating" ? "Current footprint — densification play"
          : cls === "adjacent" ? `Contiguous expansion (borders ${opN.join(", ")})`
          : "New territory — isolated regional entry";
      }
      case "distributors": {
        const d = distributorsFor(s.abbr);
        return `National coverage (${d.national.length})` + (d.regional.length ? ` + regional: ${d.regional.join(", ")}` : " — no major regional distributor density (sample)");
      }
      case "schools": return `~${TRADE_SCHOOLS[s.abbr].count} programs · ${TRADE_SCHOOLS[s.abbr].notable}`;
      case "metros": {
        const ms = METROS.filter(m => m.state === s.abbr);
        return ms.length ? ms.map(m => `${m.name} (score ${m.score})`).join(" · ") : "No sample metro yet — add one to the data block";
      }
      default: return "";
    }
  };

  const printCompare = () => {
    const activeLayers = Object.keys(layers).filter(k => layers[k]);
    const body = `
      <h2>State Comparison — ${states.map(s=>s.name).join(" vs ")}</h2>
      <table><tr><th>Layer</th>${states.map(s=>`<th>${s.name} (${s.abbr})</th>`).join("")}</tr>
      ${activeLayers.map(l => `<tr><td class="badge">${LAYER_LABELS[l]}</td>${states.map(s=>{
        const cls = stateExpansionClass(s.abbr);
        let v = "";
        if (l==="rating") v = s.rating;
        else if (l==="moat") v = s.moat + "/5 — " + MOAT_LABELS[s.moat];
        else if (l==="licensing") v = s.licensing;
        else if (l==="incentive") v = s.incentive;
        else if (l==="footprint") v = cls==="operating"?"Current footprint":cls==="adjacent"?"Contiguous expansion":"New territory";
        else if (l==="distributors") { const d=distributorsFor(s.abbr); v = d.national.concat(d.regional).join(", "); }
        else if (l==="schools") v = "~"+TRADE_SCHOOLS[s.abbr].count+" programs · "+TRADE_SCHOOLS[s.abbr].notable;
        else if (l==="metros") v = METROS.filter(m=>m.state===s.abbr).map(m=>m.name+" ("+m.score+")").join(", ") || "—";
        return `<td>${v}</td>`;
      }).join("")}</tr>`).join("")}
      </table>`;
    openPrint("State Comparison", body);
  };

  return (
    <div>
      <div className="card">
        <div className="note-label" style={{marginBottom:8}}>Compare up to 4 states</div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:10}}>
          {picked.map(a => (
            <button key={a} className="pill-btn active" onClick={() => setPicked(picked.filter(p => p!==a))}>
              {byAbbr[a] ? byAbbr[a].name : a} ✕
            </button>
          ))}
        </div>
        {picked.length < 4 && (
          <div style={{position:"relative"}}>

        <div className="toggle-row" style={{marginBottom:0}}>
          {Object.keys(LAYER_LABELS).map(k => (
            <button key={k} className={"pill-btn" + (layers[k] ? " active":"")} onClick={()=>setLayers({...layers, [k]:!layers[k]})}>{LAYER_LABELS[k]}</button>

      {states.length >= 2 ? (
        <React.Fragment>
          <div style={{display:"flex", justifyContent:"flex-end", marginBottom:10}}>
            <button className="print-btn" onClick={printCompare}>🖨 Print Comparison</button>

            <table style={{width:"100%", borderCollapse:"separate", borderSpacing:0, fontSize:13.5}}>
              <thead>
                <tr>
                  <th style={{textAlign:"left", padding:"10px 12px", color:"#8FA6BC", fontSize:11.5, textTransform:"uppercase", letterSpacing:"0.5px"}}>Layer</th>

                  ))}

              </thead>
              <tbody>
                {Object.keys(LAYER_LABELS).filter(k => layers[k]).map(l => (
                  <tr key={l}>
                    <td style={{padding:"12px", color:"#8FA6BC", fontWeight:700, fontSize:12, textTransform:"uppercase", letterSpacing:"0.5px", borderTop:"1px solid rgba(255,255,255,0.08)", verticalAlign:"top", whiteSpace:"nowrap"}}>{LAYER_LABELS[l]}</td>

      )}
    </div>
  );
}



// Lightweight markdown renderer for research output — readability first
function mdToHtml(md) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = esc(md).split("\n");
  let out = [], inList = false;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  for (let raw of lines) {
    const line = raw.trimEnd();
    const t = line.trim();
    const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
    if (t === "" ) { closeList(); continue; }
    if (/^-{3,}$/.test(t)) { closeList(); out.push("<hr/>"); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) { closeList(); const lvl = Math.min(m[1].length + 1, 4); out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`); continue; }
    if ((m = t.match(/^(?:[-*•]|\d+\.)\s+(.*)/))) { if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = t.match(/^&gt;\s?(.*)/))) { closeList(); out.push(`<div class="research-note">${inline(m[1])}</div>`); continue; }
    closeList(); out.push(`<p>${inline(t)}</p>`);
  }
  if (inList) out.push("</ul>");
  return out.join("");
}

function DataTab() {
  const [liveStatus, setLiveStatus] = useState(window.__LIVE_DATA_STATUS || "not present");
  const [task, setTask] = useState("refresh");
  const [stateSel, setStateSel] = useState("PA");
  const [scoutMetro, setScoutMetro] = useState(METROS[0].id);
  const [scoutProfile, setScoutProfile] = useState("Residential-heavy HVAC & Plumbing combo, $5M–$15M revenue, family-owned, 10+ years operating");
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState(null);

  const runResearch = async () => {
    if (!RESEARCH_WORKER_URL) return;
    setBusy(true); setErr(null); setResult(null);
    try {
      const payload = task === "refresh"
        ? { task: "refresh-state", state: stateSel }
        : { task: "scout-targets", metro: METROS.find(m => m.id === scoutMetro), profile: scoutProfile };
      const r = await fetch(RESEARCH_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error("Worker returned " + r.status);
      const data = await r.json();
      setResult(data.report || JSON.stringify(data, null, 2));
    } catch (e) {
      setErr(String(e));
    }
    setBusy(false);
  };

  return (
    <div>
      <div className="card">
        <div className="method-title">Data Status</div>
        <div className="note-line" style={{marginBottom:12}}>Every data domain in this tool carries its own status. Live file (data-live.json): <strong style={{color: liveStatus === "loaded" ? "#7EDB9C" : "#E8C468"}}>{liveStatus}</strong></div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
            <thead><tr>
              {["Data Domain","Source","Status","Last Updated"].map(h => <th key={h} style={{textAlign:"left", padding:"8px 10px", color:"#8FA6BC", fontSize:11, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:"1px solid rgba(255,255,255,0.1)"}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {DATA_DOMAINS.map(d => (
                <tr key={d.key}>
                  <td style={{padding:"9px 10px", color:"#E7EDF3", fontWeight:600, borderBottom:"1px solid rgba(255,255,255,0.06)"}}>{d.label}</td>
                  <td style={{padding:"9px 10px", color:"#C6D4E1", borderBottom:"1px solid rgba(255,255,255,0.06)"}}>{d.source}</td>
                  <td style={{padding:"9px 10px", borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                    <span className={/verified/i.test(d.status) ? "ver-badge" : "sample-badge"} style={{marginLeft:0}}>{d.status}</span>
                  </td>
                  <td style={{padding:"9px 10px", color:"#8FA6BC", borderBottom:"1px solid rgba(255,255,255,0.06)"}}>{d.updated}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="method-title">Live Research</div>
        {RESEARCH_WORKER_URL ? (
          <React.Fragment>
            <div className="toggle-row">
              <button className={"pill-btn" + (task==="refresh" ? " active":"")} onClick={()=>setTask("refresh")}>🔄 Refresh a State's Data</button>
              <button className={"pill-btn" + (task==="scout" ? " active":"")} onClick={()=>setTask("scout")}>🔎 Scout Targets in a Metro</button>
            </div>
            {task === "refresh" ? (
              <div style={{maxWidth:340}}>
                <select value={stateSel} onChange={e=>setStateSel(e.target.value)}>
                  {STATE_ROWS.map(s => <option key={s.abbr} value={s.abbr}>{s.name}{s.verified ? " (verified " + s.verifiedDate + ")" : " (sample)"}</option>)}
                </select>
              </div>
            ) : (
              <div className="grid2">
                <select value={scoutMetro} onChange={e=>setScoutMetro(e.target.value)}>
                  {METROS.map(m => <option key={m.id} value={m.id}>{m.name}, {m.state}</option>)}
                </select>
                <input type="text" value={scoutProfile} onChange={e=>setScoutProfile(e.target.value)} placeholder="Target profile description…" />
              </div>
            )}
            <div style={{marginTop:14}}>
              <button className="print-btn" disabled={busy} onClick={runResearch}>{busy ? "Researching… (30–90 seconds)" : "▶ Run Research"}</button>
            </div>
            {err && <div className="flag" style={{marginTop:12}}>⚠ {err}</div>}
            {result && <div className="research-output" dangerouslySetInnerHTML={{__html: mdToHtml(result)}} />}
            <div className="note-line" style={{marginTop:12, fontSize:12, color:"#8FA6BC"}}>Research results are session-only unless the worker is configured to commit updates to data-live.json. Findings on specific companies are leads for human review, never a substitute for diligence.</div>
          </React.Fragment>
        ) : (
          <div className="note-line">
            Live research isn't connected yet. This panel activates when a research worker endpoint is deployed and its URL is set in the <strong>RESEARCH_WORKER_URL</strong> constant at the top of this file's data block. The worker (same Cloudflare Worker pattern as the GM Success Coach) proxies the Anthropic API with web search enabled, powering two tasks from this panel: refreshing a state's licensing/incentive data on demand, and scouting acquisition-candidate companies in a chosen metro against a written target profile. Once deployed, results appear here with timestamps, and the worker can optionally commit refreshed data back to this repo as data-live.json — which makes updates permanent and shows "loaded" in the Data Status panel above.
          </div>
        )}
      </div>
    </div>
  );
}

async function boot() {
  // Attempt to load data-live.json (committed by the research worker).
  // Overrides embedded data when present; silently falls back otherwise.
  try {
    const r = await fetch("data-live.json", { cache: "no-store" });
    if (r.ok) {
      const live = await r.json();
      if (live.verifiedStates) {
        STATE_ROWS.forEach(s => {
          if (live.verifiedStates[s.abbr]) Object.assign(s, live.verifiedStates[s.abbr], { verified: true });
        });
      }
      if (live.anchors && Array.isArray(live.anchors)) {
        SILA_ANCHORS.length = 0;
        live.anchors.forEach(a => SILA_ANCHORS.push(a));
      }
      if (live.dataDomains) {
        live.dataDomains.forEach(upd => {
          const d = DATA_DOMAINS.find(x => x.key === upd.key);
          if (d) Object.assign(d, upd);
        });
      }
      window.__LIVE_DATA_STATUS = "loaded (updated " + (live.updated || "unknown") + ")";
    }
  } catch (e) { /* no live file — embedded data stands */ }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
